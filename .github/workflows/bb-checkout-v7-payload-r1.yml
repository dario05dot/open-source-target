name: BB checkout v7 workflow-run selector R2

on:
  workflow_run:
    workflows: ["PR Builder"]
    types: [completed]

permissions:
  contents: read

jobs:
  test-v7-selectors:
    if: >-
      github.event.workflow_run.event == 'pull_request_target' &&
      vars.BB_HYP061_MERGE_SHA != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted base control
        id: base-control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dario05dot/open-source-target
          path: base-control
          persist-credentials: false

      - name: Record trusted base control HEAD
        shell: bash
        run: git -C base-control rev-parse HEAD

      - name: Attempt protected fork head selector
        id: protected-head
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dario05dot/open-source-target
          ref: 62e3cda7bcb0d9ca5d297fa77eb70b635b024252
          path: protected-head
          persist-credentials: false

      - name: Assert protected selector refusal
        shell: bash
        env:
          PROTECTED_OUTCOME: ${{ steps.protected-head.outcome }}
        run: |
          printf 'PROTECTED_OUTCOME=%s\n' "$PROTECTED_OUTCOME"
          test "$PROTECTED_OUTCOME" = failure

      - name: Attempt controlled PR merge SHA selector
        id: candidate-merge
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: dario05dot/open-source-target
          ref: ${{ vars.BB_HYP061_MERGE_SHA }}
          path: candidate-merge
          persist-credentials: false

      - name: Record merge selector outcome
        shell: bash
        env:
          MERGE_OUTCOME: ${{ steps.candidate-merge.outcome }}
        run: printf 'MERGE_OUTCOME=%s\n' "$MERGE_OUTCOME"

      - name: Verify checked-out merge data only
        if: steps.candidate-merge.outcome == 'success'
        shell: bash
        env:
          EXPECTED_MERGE_SHA: ${{ vars.BB_HYP061_MERGE_SHA }}
        run: |
          actual_sha="$(git -C candidate-merge rev-parse HEAD)"
          printf 'MERGE_HEAD=%s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_MERGE_SHA"
          sha256sum candidate-merge/build.sh

      - name: Record secure merge refusal
        if: steps.candidate-merge.outcome == 'failure'
        shell: bash
        run: printf 'MERGE_REFUSED=1\n'
