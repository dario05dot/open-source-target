name: BB checkout v7 workflow-run projection R1

on:
  workflow_run:
    workflows: ["PR Builder"]
    types: [completed]

permissions: {}

jobs:
  project-selected-fields:
    if: github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BASE_REPOSITORY_ID: ${{ github.event.repository.id }}
      BASE_REPOSITORY_FULL_NAME: ${{ github.event.repository.full_name }}
      WR_ID: ${{ github.event.workflow_run.id }}
      WR_NAME: ${{ github.event.workflow_run.name }}
      WR_EVENT: ${{ github.event.workflow_run.event }}
      WR_STATUS: ${{ github.event.workflow_run.status }}
      WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      WR_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      WR_ACTOR: ${{ github.event.workflow_run.actor.login }}
      WR_TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
      WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      WR_HEAD_REPOSITORY_ID: ${{ github.event.workflow_run.head_repository.id }}
      WR_HEAD_REPOSITORY_FULL_NAME: ${{ github.event.workflow_run.head_repository.full_name }}
      WR_HEAD_COMMIT_ID: ${{ github.event.workflow_run.head_commit.id }}
      WR_REPOSITORY_ID: ${{ github.event.workflow_run.repository.id }}
      WR_REPOSITORY_FULL_NAME: ${{ github.event.workflow_run.repository.full_name }}
      WR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      WR_PR_HEAD_REPOSITORY_ID: ${{ github.event.workflow_run.pull_requests[0].head.repo.id }}
      WR_PR_HEAD_REPOSITORY_FULL_NAME: ${{ github.event.workflow_run.pull_requests[0].head.repo.full_name }}
      WR_PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
      WR_PR_BASE_REPOSITORY_ID: ${{ github.event.workflow_run.pull_requests[0].base.repo.id }}
      WR_PR_BASE_REPOSITORY_FULL_NAME: ${{ github.event.workflow_run.pull_requests[0].base.repo.full_name }}
      WR_PR_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
    steps:
      - name: Project selected workflow-run attribution fields
        shell: bash
        run: |
          printf '%s\n' \
            "BASE_REPOSITORY_ID=$BASE_REPOSITORY_ID" \
            "BASE_REPOSITORY_FULL_NAME=$BASE_REPOSITORY_FULL_NAME" \
            "WR_ID=$WR_ID" \
            "WR_NAME=$WR_NAME" \
            "WR_EVENT=$WR_EVENT" \
            "WR_STATUS=$WR_STATUS" \
            "WR_CONCLUSION=$WR_CONCLUSION" \
            "WR_RUN_ATTEMPT=$WR_RUN_ATTEMPT" \
            "WR_ACTOR=$WR_ACTOR" \
            "WR_TRIGGERING_ACTOR=$WR_TRIGGERING_ACTOR" \
            "WR_HEAD_BRANCH=$WR_HEAD_BRANCH" \
            "WR_HEAD_SHA=$WR_HEAD_SHA" \
            "WR_HEAD_REPOSITORY_ID=$WR_HEAD_REPOSITORY_ID" \
            "WR_HEAD_REPOSITORY_FULL_NAME=$WR_HEAD_REPOSITORY_FULL_NAME" \
            "WR_HEAD_COMMIT_ID=$WR_HEAD_COMMIT_ID" \
            "WR_REPOSITORY_ID=$WR_REPOSITORY_ID" \
            "WR_REPOSITORY_FULL_NAME=$WR_REPOSITORY_FULL_NAME" \
            "WR_PR_NUMBER=$WR_PR_NUMBER" \
            "WR_PR_HEAD_REPOSITORY_ID=$WR_PR_HEAD_REPOSITORY_ID" \
            "WR_PR_HEAD_REPOSITORY_FULL_NAME=$WR_PR_HEAD_REPOSITORY_FULL_NAME" \
            "WR_PR_HEAD_SHA=$WR_PR_HEAD_SHA" \
            "WR_PR_BASE_REPOSITORY_ID=$WR_PR_BASE_REPOSITORY_ID" \
            "WR_PR_BASE_REPOSITORY_FULL_NAME=$WR_PR_BASE_REPOSITORY_FULL_NAME" \
            "WR_PR_BASE_SHA=$WR_PR_BASE_SHA"
